<style>
  :root {

  body {

    color: var(--text);

  header {

    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
  }
  header h1 {
    font-size: 17px;
    margin: 0 0 8px 0;
    font-weight: 700;
  }
  .stats {
    display: flex;
    gap: 10px;
    font-size: 13px;
    color: var(--muted);
    flex-wrap: wrap;
    align-items: center;
  }
  .stat-pill {

    border-radius: 999px;
    padding: 4px 10px;
    font-weight: 600;
  }
  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 4px;
    margin-top: 8px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--primary);
    width: 0%;

  }
  #reset-btn {
    margin-left: auto;
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 12px;
  }
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .q-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 8px;
  }
  .q-num {
    font-size: 13px;
    color: var(--muted);
    font-weight: 700;
  }
  .q-source {
    font-size: 11px;
    color: var(--muted);
    background: var(--neutral-bg);
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .q-text {
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 12px;
  }
  .opt {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--neutral-bg);
    border: 1.5px solid transparent;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 14.5px;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .opt:last-child { margin-bottom: 0; }
  .opt .opt-letter {
    font-weight: 700;
    margin-right: 6px;
  }
  .opt.selected-correct {
    background: var(--correct-bg);
    border-color: var(--correct);
    color: var(--correct);
  }
  .opt.selected-wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong);
    color: var(--wrong);
  }
  .opt.reveal-correct {
    border-color: var(--correct);
    color: var(--correct);
  }
  .opt.disabled {
    cursor: default;
  }
  .feedback {
    margin-top: 10px;
    font-size: 13.5px;
    font-weight: 600;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct { color: var(--correct); }
  .feedback.wrong { color: var(--wrong); }
  .feedback .note {
    display: block;
    font-weight: 400;
    color: var(--muted);
    margin-top: 3px;
  }
  .ambiguous-tag {
    font-size: 11px;
    color: #a06b1f;
    background: #fdf3de;
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 6px;
  }
  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }
  #final-score {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    margin-bottom: 16px;
  }
  #final-score.show { display: block; }
  #final-score .big {
    font-size: 32px;
    font-weight: 800;
    color: var(--primary);
    margin-bottom: 4px;
  }
</style>
</head>

const state = {}; // num -> selected letter

function render() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  QUESTIONS.forEach(q => {
    const card = document.createElement('div');
    card.className = 'q-card';

    const head = document.createElement('div');
    head.className = 'q-head';
    const numEl = document.createElement('span');
    numEl.className = 'q-num';
    numEl.textContent = 'Question ' + q.num;
    if (!q.answer) {
      const tag = document.createElement('span');
      tag.className = 'ambiguous-tag';
      tag.textContent = 'disputed answer';
      numEl.appendChild(tag);
    }
    const srcEl = document.createElement('span');
    srcEl.className = 'q-source';
    srcEl.textContent = q.source;
    head.appendChild(numEl);
    head.appendChild(srcEl);
    card.appendChild(head);

    const textEl = document.createElement('div');
    textEl.className = 'q-text';
    textEl.textContent = q.question;
    card.appendChild(textEl);

    const letters = ['A', 'B', 'C', 'D'];
    const feedback = document.createElement('div');
    feedback.className = 'feedback';

    letters.forEach(letter => {
      const optText = q.options[letter];
      if (!optText) return;
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="opt-letter">' + letter + ')</span> ' + optText;
      btn.dataset.letter = letter;
      btn.addEventListener('click', () => handleAnswer(q, letter, card, feedback));
      card.appendChild(btn);
    });

    card.appendChild(feedback);
    container.appendChild(card);
  });
  updateStats();
}

function handleAnswer(q, letter, card, feedback) {
  if (state[q.num] !== undefined) return; // already answered
  state[q.num] = letter;

  const optButtons = card.querySelectorAll('.opt');
  optButtons.forEach(btn => btn.classList.add('disabled'));

  if (!q.answer) {
    // disputed / no confirmed answer
    optButtons.forEach(btn => {
      if (btn.dataset.letter === letter) {
        btn.classList.add('selected-wrong');
      }
    });
    feedback.classList.add('show', 'wrong');
    feedback.innerHTML = 'No single confirmed answer for this question.' +
      '<span class="note">' + (q.note || '') + '</span>';
  } else if (letter === q.answer) {
    optButtons.forEach(btn => {
      if (btn.dataset.letter === letter) btn.classList.add('selected-correct');
    });
    feedback.classList.add('show', 'correct');
    feedback.textContent = 'Correct!';
  } else {
    optButtons.forEach(btn => {
      if (btn.dataset.letter === letter) btn.classList.add('selected-wrong');
      if (btn.dataset.letter === q.answer) btn.classList.add('reveal-correct');
    });
    feedback.classList.add('show', 'wrong');
    feedback.textContent = 'Incorrect. The correct answer is ' + q.answer + '.';
  }

  updateStats();
}

function updateStats() {
  const answeredNums = Object.keys(state);
  const answered = answeredNums.length;
  let correct = 0;
  answeredNums.forEach(numStr => {
    const num = parseInt(numStr, 10);
    const q = QUESTIONS.find(qq => qq.num === num);
    if (q && q.answer && state[num] === q.answer) correct++;
  });

  document.getElementById('progress-text').textContent = answered + ' / ' + QUESTIONS.length + ' answered';
  document.getElementById('score-text').textContent = 'Score: ' + correct + ' / ' + answered;
  document.getElementById('progress-fill').style.width = (answered / QUESTIONS.length * 100) + '%';

  const finalScore = document.getElementById('final-score');
  if (answered === QUESTIONS.length) {
    finalScore.classList.add('show');
    document.getElementById('final-score-text').textContent = correct + ' / ' + QUESTIONS.length;
  } else {
    finalScore.classList.remove('show');
  }
}

document.getElementById('reset-btn').addEventListener('click', () => {
  Object.keys(state).forEach(k => delete state[k]);
  render();
  window.scrollTo(0, 0);
});

render();
</script>
